{
  "apiVersion": "v1",
  "kind": "List",
  "items": [
    {
      "apiVersion": "v1",
      "kind": "Service",
      "metadata": {
        "name": "cars-db"
      },
      "spec": {
        "selector": {
          "app": "cars-db"
        },
        "ports": [
          {
            "port": 27017,
            "targetPort": 27017
          }
        ]
      }
    },
    {
      "apiVersion": "apps/v1",
      "kind": "Deployment",
      "metadata": {
        "name": "cars-db"
      },
      "spec": {
        "replicas": 1,
        "strategy": {
          "type": "Recreate"
        },
        "selector": {
          "matchLabels": {
            "app": "cars-db"
          }
        },
        "template": {
          "metadata": {
            "labels": {
              "app": "cars-db"
            }
          },
          "spec": {
            "containers": [
              {
                "name": "cars-db",
                "image": "mongo:7.0",
                "imagePullPolicy": "Always",
                "ports": [
                  {
                    "containerPort": 27017
                  }
                ],
                "resources": {
                  "requests": {
                    "cpu": "25m",
                    "memory": "128Mi"
                  },
                  "limits": {
                    "cpu": "500m",
                    "memory": "512Mi"
                  }
                },
                "volumeMounts": [
                  {
                    "name": "data",
                    "mountPath": "/data/db"
                  }
                ],
                "readinessProbe": {
                  "exec": {
                    "command": [
                      "mongosh",
                      "--quiet",
                      "--eval",
                      "db.adminCommand('ping').ok"
                    ]
                  },
                  "initialDelaySeconds": 10,
                  "periodSeconds": 10,
                  "timeoutSeconds": 10
                }
              }
            ],
            "volumes": [
              {
                "name": "data",
                "emptyDir": {}
              }
            ]
          }
        }
      }
    },
    {
      "apiVersion": "v1",
      "kind": "Service",
      "metadata": {
        "name": "cars-api"
      },
      "spec": {
        "selector": {
          "app": "cars-api"
        },
        "ports": [
          {
            "port": 3030,
            "targetPort": 3030
          }
        ]
      }
    },
    {
      "apiVersion": "apps/v1",
      "kind": "Deployment",
      "metadata": {
        "name": "cars-api"
      },
      "spec": {
        "replicas": 1,
        "strategy": {
          "type": "Recreate"
        },
        "selector": {
          "matchLabels": {
            "app": "cars-api"
          }
        },
        "template": {
          "metadata": {
            "labels": {
              "app": "cars-api"
            }
          },
          "spec": {
            "containers": [
              {
                "name": "cars-api",
                "image": "us.icr.io/sn-labs-hungtvt2222/cars-api:capstone",
                "imagePullPolicy": "Always",
                "ports": [
                  {
                    "containerPort": 3030
                  }
                ],
                "resources": {
                  "requests": {
                    "cpu": "25m",
                    "memory": "64Mi"
                  },
                  "limits": {
                    "cpu": "500m",
                    "memory": "256Mi"
                  }
                },
                "env": [
                  {
                    "name": "MONGO_URL",
                    "value": "mongodb://cars-db:27017/dealershipsDB"
                  }
                ],
                "readinessProbe": {
                  "httpGet": {
                    "path": "/",
                    "port": 3030
                  },
                  "initialDelaySeconds": 10,
                  "periodSeconds": 5
                }
              }
            ]
          }
        }
      }
    },
    {
      "apiVersion": "v1",
      "kind": "Service",
      "metadata": {
        "name": "cars-sentiment"
      },
      "spec": {
        "selector": {
          "app": "cars-sentiment"
        },
        "ports": [
          {
            "port": 5000,
            "targetPort": 5000
          }
        ]
      }
    },
    {
      "apiVersion": "apps/v1",
      "kind": "Deployment",
      "metadata": {
        "name": "cars-sentiment"
      },
      "spec": {
        "replicas": 1,
        "strategy": {
          "type": "Recreate"
        },
        "selector": {
          "matchLabels": {
            "app": "cars-sentiment"
          }
        },
        "template": {
          "metadata": {
            "labels": {
              "app": "cars-sentiment"
            }
          },
          "spec": {
            "containers": [
              {
                "name": "cars-sentiment",
                "image": "us.icr.io/sn-labs-hungtvt2222/cars-sentiment:capstone",
                "imagePullPolicy": "Always",
                "ports": [
                  {
                    "containerPort": 5000
                  }
                ],
                "resources": {
                  "requests": {
                    "cpu": "25m",
                    "memory": "64Mi"
                  },
                  "limits": {
                    "cpu": "500m",
                    "memory": "256Mi"
                  }
                },
                "readinessProbe": {
                  "httpGet": {
                    "path": "/",
                    "port": 5000
                  },
                  "initialDelaySeconds": 10,
                  "periodSeconds": 5
                }
              }
            ]
          }
        }
      }
    },
    {
      "apiVersion": "v1",
      "kind": "Service",
      "metadata": {
        "name": "dealership"
      },
      "spec": {
        "selector": {
          "app": "dealership"
        },
        "ports": [
          {
            "port": 8000,
            "targetPort": 8000
          }
        ]
      }
    },
    {
      "apiVersion": "apps/v1",
      "kind": "Deployment",
      "metadata": {
        "name": "dealership"
      },
      "spec": {
        "replicas": 1,
        "strategy": {
          "type": "Recreate"
        },
        "selector": {
          "matchLabels": {
            "app": "dealership"
          }
        },
        "template": {
          "metadata": {
            "labels": {
              "app": "dealership"
            }
          },
          "spec": {
            "containers": [
              {
                "name": "dealership",
                "image": "us.icr.io/sn-labs-hungtvt2222/dealership:capstone",
                "imagePullPolicy": "Always",
                "ports": [
                  {
                    "containerPort": 8000
                  }
                ],
                "resources": {
                  "requests": {
                    "cpu": "25m",
                    "memory": "64Mi"
                  },
                  "limits": {
                    "cpu": "500m",
                    "memory": "256Mi"
                  }
                },
                "env": [
                  {
                    "name": "BACKEND_URL",
                    "value": "http://cars-api:3030"
                  },
                  {
                    "name": "SENTIMENT_URL",
                    "value": "https://cars-sentiment.2gtgnvkvqbxe.us-south.codeengine.appdomain.cloud"
                  },
                  {
                    "name": "DJANGO_ALLOWED_HOSTS",
                    "value": "localhost,127.0.0.1,.cognitiveclass.ai"
                  },
                  {
                    "name": "SQLITE_PATH",
                    "value": "/data/db.sqlite3"
                  },
                  {
                    "name": "DJANGO_SECRET_KEY",
                    "valueFrom": {
                      "secretKeyRef": {
                        "name": "cars-runtime",
                        "key": "DJANGO_SECRET_KEY"
                      }
                    }
                  },
                  {
                    "name": "DEMO_ADMIN_PASSWORD",
                    "valueFrom": {
                      "secretKeyRef": {
                        "name": "cars-runtime",
                        "key": "DEMO_ADMIN_PASSWORD"
                      }
                    }
                  },
                  {
                    "name": "DEMO_USER_PASSWORD",
                    "valueFrom": {
                      "secretKeyRef": {
                        "name": "cars-runtime",
                        "key": "DEMO_USER_PASSWORD"
                      }
                    }
                  }
                ],
                "volumeMounts": [
                  {
                    "name": "data",
                    "mountPath": "/data"
                  }
                ],
                "readinessProbe": {
                  "httpGet": {
                    "path": "/djangoapp/session",
                    "port": 8000,
                    "httpHeaders": [
                      {
                        "name": "Host",
                        "value": "localhost"
                      }
                    ]
                  },
                  "initialDelaySeconds": 10,
                  "periodSeconds": 5
                }
              }
            ],
            "volumes": [
              {
                "name": "data",
                "emptyDir": {}
              }
            ]
          }
        }
      }
    }
  ]
}
