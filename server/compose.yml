services:
  mongo:
    image: mongo:7.0
    volumes: [cars_mongo:/data/db]
    healthcheck:
      test: [CMD, mongosh, --quiet, --eval, "db.adminCommand('ping').ok"]
      interval: 5s
      retries: 20
  api:
    build: ./database
    environment:
      MONGO_URL: mongodb://mongo:27017/dealershipsDB
    depends_on:
      mongo: {condition: service_healthy}
    ports: ["127.0.0.1:3030:3030"]
  sentiment:
    build: ./djangoapp/microservices
    ports: ["127.0.0.1:5050:5000"]
  dealership:
    build: .
    environment:
      BACKEND_URL: http://api:3030
      SENTIMENT_URL: http://sentiment:5000
      DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1,.cognitiveclass.ai
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:?Set DJANGO_SECRET_KEY}
      DEMO_ADMIN_PASSWORD: ${DEMO_ADMIN_PASSWORD:?Set DEMO_ADMIN_PASSWORD}
      DEMO_USER_PASSWORD: ${DEMO_USER_PASSWORD:?Set DEMO_USER_PASSWORD}
      SQLITE_PATH: /data/db.sqlite3
    depends_on: [api, sentiment]
    volumes: [cars_sqlite:/data]
    ports: ["127.0.0.1:8000:8000"]
volumes:
  cars_mongo:
  cars_sqlite:
